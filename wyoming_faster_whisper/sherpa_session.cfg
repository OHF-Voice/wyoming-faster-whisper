# sherpa-onnx provider config for CPU sessions, passed as "cpu:<this file>" by
# device.sherpa_session_provider(). Keys prefixed with "SessionConfig." go to
# onnxruntime's SessionOptions.AddConfigEntry (sherpa-onnx 1.13.5 and later).
#
# Stop the thread pools from busy-waiting after each run (issue #135).
SessionConfig.session.intra_op.allow_spinning=0
SessionConfig.session.inter_op.allow_spinning=0
